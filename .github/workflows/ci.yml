name: ci
on: [push, pull_request]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sin datos ni secretos versionados
        run: |
          bad=$(git ls-files | grep -Ei '\.(csv|parquet|zip|gz|jpg|tfstate)$|credenciales|\.env$' || true)
          if [ -n "$bad" ]; then echo "Archivos prohibidos:"; echo "$bad"; exit 1; fi

      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v   # incluye API con SQLite y asistente en modo reglas
      - name: Calculadora de costos
        run: python cost/estimate_costs.py
      - uses: actions/upload-artifact@v4
        with: { name: cost-estimate, path: cost/output/ }

      - uses: hashicorp/setup-terraform@v3
      - name: Terraform fmt/validate (sin credenciales ni backend)
        working-directory: infra/terraform
        run: terraform fmt -check -recursive && terraform init -backend=false && terraform validate
