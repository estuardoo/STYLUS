name: deploy-api
# Publica la API/web en Cloud Run. Requiere las variables del repositorio (Settings > Variables):
# GCP_PROJECT_ID, GCP_REGION, GCP_WIF_PROVIDER, GCP_DEPLOYER_SA (salidas de terraform output).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["api/**"]

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: ${{ vars.GCP_PROJECT_ID != '' }}
    runs-on: ubuntu-latest
    env:
      REGION: ${{ vars.GCP_REGION }}
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/retail/retail-api:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Construir y publicar imagen
        run: |
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build -t "$IMAGE" api
          docker push "$IMAGE"
      - name: Desplegar revisión
        run: gcloud run deploy retail-api --image "$IMAGE" --region "$REGION" --quiet
      - name: Smoke test
        run: |
          URL=$(gcloud run services describe retail-api --region "$REGION" --format 'value(status.url)')
          curl -fsS "$URL/health" && curl -fsS "$URL/ready"
