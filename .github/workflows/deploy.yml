name: deploy-api
# Publica la API/web en Cloud Run. Proyecto, región y nombres salen de config/generated/plataforma.json
# (Excel de control). Única variable de GitHub: GCP_WIF_PROVIDER (python ops.py github la muestra).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["api/**", "config/**"]

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: ${{ vars.GCP_WIF_PROVIDER != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Leer configuración
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import json
          c = json.load(open("config/generated/plataforma.json", encoding="utf-8"))
          p, d = c["params"], c["derived"]
          print(f"PROJECT={p['project_id']}\nREGION={p['region']}\nSERVICE={p['cloudrun_service']}")
          print(f"IMAGE={d['image_repo']}:${{ github.sha }}\nDEPLOYER={d['sa_emails'][p['deployer_sa_key']]}")
          PY
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Construir y publicar imagen
        run: |
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build -t "$IMAGE" api
          docker push "$IMAGE"
      - name: Desplegar revisión
        run: gcloud run deploy "$SERVICE" --image "$IMAGE" --region "$REGION" --project "$PROJECT" --quiet
      - name: Smoke test
        run: |
          URL=$(gcloud run services describe "$SERVICE" --region "$REGION" --project "$PROJECT" --format 'value(status.url)')
          curl -fsS "$URL/health" && curl -fsS "$URL/ready"
